name: NPM Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Read package.json
        id: package
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Publish Package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="${{ steps.package.outputs.package_name }}"
          PACKAGE_VERSION="${{ steps.package.outputs.package_version }}"

          echo "### 🚀 NPM Publication Summary" >> $GITHUB_STEP_SUMMARY
          echo "* **Package**: \`$PACKAGE_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Version**: \`$PACKAGE_VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Repository**: <a href=\"https://github.com/${{ github.repository }}\" target=\"_blank\">${{ github.repository }}</a>" >> $GITHUB_STEP_SUMMARY

          npm publish

          echo "* **Status**: ✅ Successfully Published" >> $GITHUB_STEP_SUMMARY
          echo "* **Registry**: <a href=\"https://www.npmjs.com/package/$PACKAGE_NAME\" target=\"_blank\">https://www.npmjs.com/package/$PACKAGE_NAME</a>" >> $GITHUB_STEP_SUMMARY