name: NPM Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Read package.json
        id: package
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Check package on npm
        shell: bash
        run: |
          PACKAGE_NAME="${{ steps.package.outputs.package_name }}"
          PACKAGE_VERSION="${{ steps.package.outputs.package_version }}"

          BEFORE_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "Not Published")

          echo "### 📦 NPM Package Check" >> $GITHUB_STEP_SUMMARY
          echo "* **Package**: \`$PACKAGE_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Current Version**: \`$PACKAGE_VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Published Version**: \`$BEFORE_VERSION\`" >> $GITHUB_STEP_SUMMARY

          if [ "$BEFORE_VERSION" = "$PACKAGE_VERSION" ]; then
            echo "* **Status**: ⚠️ Version already exists on npm." >> $GITHUB_STEP_SUMMARY
          else
            echo "* **Status**: ✅ Ready to publish." >> $GITHUB_STEP_SUMMARY
          fi